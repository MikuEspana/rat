name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard checks (single send path, no secrets, contract is browser safe)
        run: pnpm check:guards
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
