name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard checks (single send path, no secrets, contract is browser safe)
        run: pnpm check:guards
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -f infra/Dockerfile -t rat-race:ci .
      - name: The image starts (CLI status on an in-memory database, DRY RUN default)
        run: docker run --rm -e DATABASE_URL=memory:// rat-race:ci pnpm --silent --filter @rat/cli rat status
      - name: solana-keygen is in the image
        run: docker run --rm rat-race:ci solana-keygen --version
      - name: The worker's key grinder works with the real solana-keygen (throwaway test keys, in-memory database)
        run: docker run --rm rat-race:ci pnpm --silent --filter @rat/keys check:keygen
