name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard checks (single send path, no secrets, contract is browser safe)
        run: pnpm check:guards
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  chaos:
    # worker killed before every step of a hire and a burn, RPC / database outages at every call, Jupiter 429 storm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chaos tests
        run: pnpm test:chaos

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -f infra/Dockerfile -t rat-race:ci .
      - name: The image starts (CLI status on an in-memory database, DRY RUN default)
        run: docker run --rm -e DATABASE_URL=memory:// rat-race:ci pnpm --silent --filter @rat/cli rat status
