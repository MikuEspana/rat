name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard checks (single send path, no secrets, contract is browser safe)
        run: pnpm check:guards
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  long:
    # chaos (worker killed before every step of a hire and a burn, RPC / database outages at every call, Jupiter 429
    # storm) and the 3-hour launch simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chaos tests and the 3-hour launch simulation
        run: pnpm test:long

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -f infra/Dockerfile -t rat-race:ci .
      - name: The image starts (CLI status on an in-memory database, DRY RUN default)
        run: docker run --rm -e DATABASE_URL=memory:// rat-race:ci pnpm --silent --filter @rat/cli rat status
      - name: Every service loads in the image (production-only install)
        # an invalid DRY_RUN stops each service at its first line of code: reaching that error proves every import
        # resolved (a module left out of the image fails before it, with ERR_MODULE_NOT_FOUND)
        run: |
          for svc in worker api admin; do
            out=$(docker run --rm -e DRY_RUN=maybe rat-race:ci pnpm --silent --filter "@rat/$svc" start 2>&1 || true)
            if printf '%s' "$out" | grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (module|package)' || ! printf '%s' "$out" | grep -q 'DRY_RUN: expected true/false'; then
              printf '%s\n' "$out" | tail -20
              echo "$svc does not load in the image"
              exit 1
            fi
            echo "$svc loads"
          done
      - name: Image size
        run: docker image ls rat-race:ci --format 'rat-race:ci {{.Size}}'
      - name: Build the backup image
        run: docker build -f infra/backup/Dockerfile -t rat-backup:ci .
      - name: The backup image has its tools and refuses to run without settings
        run: |
          docker run --rm --entrypoint sh rat-backup:ci -c 'age --version && curl --version | head -1 && pg_dump --version | grep "PostgreSQL) 18\."'
          if docker run --rm rat-backup:ci >out.txt 2>&1; then cat out.txt; exit 1; fi
          cat out.txt
          grep -q "FAILED at step 'setup': DATABASE_URL is not set" out.txt

  backup:
    # the nightly backup end to end on a real Postgres 18 (the major of infra/backup/Dockerfile and Railway): a simulated launch, backup.sh (run by busybox, as in the
    # Alpine image), a signed upload to a local S3 server, restore-check.sh, every table compared, and the failure
    # alerts (infra/backup/selftest.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pg-ci-7f3a91
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shell scripts (shellcheck is on the runner)
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh infra/backup/*.sh tests/scripts/*.sh
      - name: Rehearsal script (staging.sh with fake rat and railway)
        run: bash tests/scripts/staging-test.sh
      - name: Fast rehearsal script (staging-local.sh with fake railway and stand-in apps)
        run: bash tests/scripts/staging-local-test.sh
      - name: Launch script (launch.sh in one build, with fake railway, rat and RPC)
        run: bash tests/scripts/launch-test.sh
      - name: Key backup to the Mac (scripts/keys-backup.sh)
        run: bash tests/scripts/keys-backup-test.sh
      - name: Tools (Postgres 18 client from the PostgreSQL apt repository, age, busybox, a local S3 server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 age busybox-static
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version | grep -q "PostgreSQL) 18\."
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q "moto[server]"
          mkdir -p /tmp/bb
          for a in sh timeout sha256sum md5sum wc cut grep tr sed head tail date mkdir rm chmod cat printf; do ln -s "$(command -v busybox)" "/tmp/bb/$a"; done
      - name: Backup self-test
        env:
          SELFTEST_PG_URL: postgres://postgres:pg-ci-7f3a91@localhost:5432/postgres
          SELFTEST_SH: /tmp/bb/sh
          SELFTEST_BACKUP_PATH: /tmp/bb
          SELFTEST_PYTHON: /tmp/moto/bin/python
        run: infra/backup/selftest.sh
